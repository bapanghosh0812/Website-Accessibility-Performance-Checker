[build]
  command = "npm run build"
  publish = "dist/fresnel/browser"
  functions = "netlify/functions"

[[plugins]]
  package = "@netlify/angular-runtime"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

